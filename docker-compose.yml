services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: adolfo-figueiredo-portfolio:latest
    container_name: adolfo-figueiredo-portfolio
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
